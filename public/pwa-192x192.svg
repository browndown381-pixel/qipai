<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="emeraldBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0F573E" />
      <stop offset="65%" stop-color="#072B1E" />
      <stop offset="100%" stop-color="#041810" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#emeraldBg)" />
  <rect x="10" y="10" width="172" height="172" rx="34" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.85" />
  <!-- Left Card -->
  <g transform="translate(72, 102) rotate(-16)">
