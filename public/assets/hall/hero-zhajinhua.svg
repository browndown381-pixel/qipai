<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#7e22ce" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#facc15" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Ambient Royal Purple Burst -->
  <circle cx="200" cy="130" r="130" fill="url(#purpleGlow)"/>

  <!-- Golden Radiance Rays behind Cards -->
  <g opacity="0.35">
    <line x1="200" y1="130" x2="60" y2="20" stroke="#fde047" stroke-width="3"/>
    <line x1="200" y1="130" x2="130" y2="10" stroke="#fde047" stroke-width="4"/>
    <line x1="200" y1="130" x2="200" y2="5" stroke="#fde047" stroke-width="5"/>
    <line x1="200" y1="130" x2="270" y2="10" stroke="#fde047" stroke-width="4"/>
    <line x1="200" y1="130" x2="340" y2="20" stroke="#fde047" stroke-width="3"/>
  </g>

  <!-- Legendary 3 Aces ("豹子 AAA" Trio) -->
  <g filter="url(#shadow)">
    <!-- Left Card: Ace of Hearts (Red A) -->
    <g transform="translate(130, 60) rotate(-16)">
      <rect width="80" height="120" rx="10" fill="url(#cardGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
      <!-- Gold Inner Border -->
      <rect x="4" y="4" width="72" height="112" rx="7" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="12" y="28" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#e11d48">A</text>
      <text x="12" y="48" font-family="Arial, sans-serif" font-size="18" fill="#e11d48">♥</text>
      <text x="40" y="80" font-family="Arial, sans-serif" font-size="38" fill="#e11d48" text-anchor="middle">♥</text>
    </g>

    <!-- Right Card: Ace of Clubs (Club A) -->
    <g transform="translate(190, 60) rotate(16)">
      <rect width="80" height="120" rx="10" fill="url(#cardGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
      <rect x="4" y="4" width="72" height="112" rx="7" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="12" y="28" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#18181b">A</text>
      <text x="12" y="48" font-family="Arial, sans-serif" font-size="18" fill="#18181b">♣</text>
      <text x="40" y="80" font-family="Arial, sans-serif" font-size="38" fill="#18181b" text-anchor="middle">♣</text>
    </g>

    <!-- Center Dominant Card: Ace of Spades (Spade King A with Royal Crest) -->
    <g transform="translate(160, 48) rotate(0)">
      <rect width="80" height="120" rx="10" fill="url(#cardGrad)" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#glow)"/>
      <rect x="4" y="4" width="72" height="112" rx="7" fill="none" stroke="#fde047" stroke-width="1.5"/>
      <text x="12" y="28" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#09090b">A</text>
      <text x="12" y="48" font-family="Arial, sans-serif" font-size="20" fill="#09090b">♠</text>
      <text x="40" y="82" font-family="Arial, sans-serif" font-size="44" fill="#09090b" text-anchor="middle">♠</text>
    </g>
  </g>

  <!-- Golden Crown on Top Center Card -->
  <g transform="translate(176, 22)" filter="url(#glow)">
    <path d="M0,20 L10,5 L24,14 L38,5 L48,20 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="10" cy="5" r="3" fill="#ffffff"/>
    <circle cx="24" cy="14" r="3" fill="#ffffff"/>
    <circle cx="38" cy="5" r="3" fill="#ffffff"/>
  </g>

  <!-- Front Foreground: Shimmering Casino Dice & Golden Stacks of Chips -->
  <g filter="url(#shadow)">
    <!-- Left Dice (Red Glass) -->
    <g transform="translate(115, 175) rotate(18)">
      <rect width="32" height="32" rx="6" fill="#dc2626" stroke="#fecaca" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="4.5" fill="#ffffff"/>
      <circle cx="9" cy="9" r="3" fill="#ffffff"/>
      <circle cx="23" cy="23" r="3" fill="#ffffff"/>
    </g>

    <!-- Right Dice (Gold & White) -->
    <g transform="translate(250, 180) rotate(-14)">
      <rect width="32" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="4.5" fill="#dc2626"/>
      <circle cx="9" cy="9" r="3" fill="#0f172a"/>
      <circle cx="23" cy="23" r="3" fill="#0f172a"/>
    </g>

    <!-- Center Stack of Royal Chips -->
    <ellipse cx="200" cy="216" rx="38" ry="14" fill="#7e22ce" stroke="#fde047" stroke-width="2"/>
    <ellipse cx="200" cy="204" rx="38" ry="14" fill="#9333ea" stroke="#fde047" stroke-width="2"/>
    <ellipse cx="200" cy="192" rx="38" ry="14" fill="url(#goldGrad)" stroke="#fde047" stroke-width="2.5" filter="url(#glow)"/>
    <text x="200" y="196" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#581c87" text-anchor="middle">10000</text>
  </g>

  <!-- Glint Stars -->
  <polygon points="150,40 153,48 162,50 154,54 156,62 150,57 144,62 146,54 138,50 147,48" fill="#ffffff" filter="url(#glow)"/>
  <polygon points="260,35 262,41 269,43 263,47 265,53 260,49 255,53 257,47 251,43 258,41" fill="#fde047" filter="url(#glow)"/>
</svg>
