    <text x="-22" y="-24" font-family="Outfit, sans-serif" font-weight="800" font-size="18" fill="#DC2626">A</text>
    <path d="M0 -8 C-10 -20 -22 -6 0 14 C22 -6 10 -20 0 -8 Z" fill="#DC2626" />
  </g>
  <!-- Right Card (Laizi Gold Star Card) -->
  <g transform="translate(116, 100) rotate(12)">
