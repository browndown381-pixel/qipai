    <text x="-24" y="-24" font-family="Outfit, sans-serif" font-weight="800" font-size="18" fill="#B45309">★</text>
    <polygon points="0,-16 5,-4 18,-4 8,4 12,17 0,9 -12,17 -8,4 -18,-4 -5,-4" fill="url(#goldGrad)" />
    <text x="0" y="34" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="900" font-size="13" fill="#92400E">斗地主</text>
  </g>
